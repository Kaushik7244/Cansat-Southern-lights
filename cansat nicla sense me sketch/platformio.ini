; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nicla_sense_me]
platform = nordicnrf52
board = nicla_sense_me
framework = arduino
;upload_protocol = cmsis-dap
;monitor_speed = 115200
;lib_ldf_mode = deep+
lib_deps = 
	arduino-libraries/Arduino_BHY2@^1.0.8
	arduino-libraries/ArduinoBLE@^1.3.4
;board_build.softdevice.sd_fwid = 0x00B7
;board_build.softdevice.sd_name = s132
;board_build.softdevice.sd_version = 6.1.1
;board_build.softdevice.sd_flags = -DS132
;platform_packages = platformio/tool-adafruit-nrfutil@^1.503.0
