; https://docs.platformio.org/page/projectconf.html

[env:portenta_h7_m7]
platform = ststm32
board = portenta_h7_m7
framework = arduino
upload_protocol = dfu
build_type = release
lib_deps = 
	arduino-libraries/Arduino_BHY2Host
	arduino-libraries/ArduinoBLE@^1.3.4
	mikalhart/TinyGPSPlus@^1.1.0
