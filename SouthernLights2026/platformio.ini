; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cansat_m7

[env:cansat_m7]
platform = ststm32
board = portenta_h7_m7
framework = arduino
build_src_filter = +<cansat_m7/*>
;upload_protocol = dfu
;upload_flags = -d 2341:035b
;board_upload.use_1200bps_touch = false
;board_upload.wait_for_upload_port = false
lib_deps = 
	arduino-libraries/MKRWAN@^1.1.2
	mikalhart/TinyGPSPlus@^1.0.3
	arduino-libraries/Servo@^1.2.2
	arduino-libraries/ArduinoBLE@^2.0.0	

[env:cansat_m4]
platform = ststm32
board = portenta_h7_m4
framework = arduino
build_src_filter = +<cansat_m4/*>

[env:cansat_nicla]
platform = nordicnrf52
board = nicla_sense_me
framework = arduino
build_src_filter = +<cansat_nicla/*>
lib_deps =
	arduino-libraries/Arduino_BHY2@^1.0.0

[env:groundstation_1310]
platform = atmelsam
board = mkrwan1310
framework = arduino
build_src_filter = +<groundstation_1310/*>
lib_deps = sandeepmistry/LoRa@^0.8.0

; ---------------------------------------------------------------------------
; LoRa P2P test bench — standalone environments, not part of flight build
; lora_test_h7_a: Node 1 — H7 + Vision Shield dumb mode TX+RX
; lora_test_h7_b: Node 2 — H7 + Vision Shield dumb mode TX+RX (2.5 s TX offset)
; lora_test_1310: MKR WAN 1310 — continuous TX beacon + channel RSSI
; ---------------------------------------------------------------------------
[env:lora_test_h7_a]
platform = ststm32
board = portenta_h7_m7
framework = arduino
build_src_filter = +<lora_test_h7/*>
build_flags = -DNODE_ID=1
lib_deps =
	arduino-libraries/MKRWAN@^1.1.2

[env:lora_test_h7_b]
platform = ststm32
board = portenta_h7_m7
framework = arduino
build_src_filter = +<lora_test_h7/*>
build_flags = -DNODE_ID=2
lib_deps =
	arduino-libraries/MKRWAN@^1.1.2

[env:lora_test_1310]
platform = atmelsam
board = mkrwan1310
framework = arduino
build_src_filter = +<lora_test_1310/*>
lib_deps = sandeepmistry/LoRa@^0.8.0
